<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZDEVCO</title>
    <link rel="icon" type="image/svg+xml" href="/navigation bar/Cube.svg">
    <script src="loader.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        font-family: "DM Sans", sans-serif;
        background-color: #000;
        overflow: hidden;
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100);
        width: 100vw;
        margin: 0;
        padding: 0;
        /* Performance optimizations */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Hardware acceleration */
        transform: translateZ(0);
        backface-visibility: hidden;
        perspective: 1000px;
      }

      .navigation-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100px;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .nav-arrow {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
      }

      .nav-arrow:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
      }

      .nav-arrow svg {
        width: 24px;
        height: 24px;
      }

      .nav-thumbnails {
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .thumbnail {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }

      .thumbnail:hover {
        transform: scale(1.1);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .thumbnail.active {
        border-color: #fff;
        transform: scale(1.1);
      }

      .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        max-width: 1920px;
        max-height: 1080px;
      }

      .slider {
        position: fixed;
        top: 100px;
        left: 0;
        width: 100vw;
        height: calc(100vh - 100px);
        height: calc(calc(var(--vh, 1vh) * 100) - 100px);
        background-color: #000;
        overflow: hidden;
      }

      .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        will-change: transform, opacity;
        /* Hardware acceleration for smoother animations */
        transform: translateZ(0);
        backface-visibility: hidden;
        /* Optimize for animations */
        contain: layout style paint;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .slide-img {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        background-color: #000;
      }

      .slide-title {
        position: absolute;
        top: 4rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: white;
        z-index: 100;
        max-width: 80%;
      }

      .slide-tags {
        position: absolute;
        bottom: 4rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: white;
        z-index: 100;
        max-width: 80%;
        margin-top: 0;
      }

      .slide-title h1 {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 1rem;
        font-family: "DM Sans", sans-serif;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .slide-description p {
        font-size: 1.2rem;
        line-height: 1.6;
        opacity: 0.9;
        max-width: 600px;
        margin: 0 auto;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }

      .slide-tags {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .slide-tags p {
        background: rgba(255, 255, 255, 0.1);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.9rem;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        margin: 0;
        transition: all 0.3s ease;
        opacity: 0;
        transform: translateY(20px);
        animation: slideInUp 0.6s ease forwards;
      }

      .slide-tags p:nth-child(1) {
        animation-delay: 0.2s;
        order: 1;
      }

      .slide-tags p:nth-child(2) {
        animation-delay: 0.4s;
        order: 2;
      }

      .slide-tags p:nth-child(3) {
        animation-delay: 0.6s;
        order: 3;
      }

      @keyframes slideInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .line,
      .word {
        position: relative;
        display: inline-block;
        will-change: transform;
        /* Optimize text animations */
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Back to Commercial Button */
      .back-button {
        position: fixed;
        top: 100px;
        left: 2rem;
        z-index: 1001;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 0.8rem 1.5rem;
        color: #fff;
        text-decoration: none;
        font-family: "DM Mono", monospace;
        font-size: 0.9rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: -0.01rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .back-button:hover {
        background: #fff;
        color: #000;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
      }

      .back-button svg {
        width: 16px;
        height: 16px;
        transition: transform 0.3s ease;
      }

      .back-button:hover svg {
        transform: translateX(-3px);
      }

      /* Image Counter */
      .image-counter {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 1001;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 0.8rem 1.5rem;
        color: #fff;
        font-family: "DM Mono", monospace;
        font-size: 0.9rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: -0.01rem;
        transition: all 0.3s ease;
      }

      /* Mobile Responsive */
      @media (max-width: 1000px) {
        .navigation-bar {
          height: 80px;
          padding: 0 1rem;
        }

        .slider {
          top: 80px;
          height: calc(100vh - 80px);
          height: calc(calc(var(--vh, 1vh) * 100) - 80px);
        }

        .slide {
          height: 100%;
        }

        .nav-arrow {
          width: 40px;
          height: 40px;
        }

        .nav-arrow svg {
          width: 20px;
          height: 20px;
        }

        .thumbnail {
          width: 40px;
          height: 40px;
        }

        .nav-thumbnails {
          gap: 0.5rem;
        }

        .slide-title h1 {
          font-size: 2rem;
        }

        .slide-description p {
          font-size: 1rem;
        }

        .slide-title {
          top: 3rem;
          max-width: 90%;
        }

        .slide-tags {
          bottom: 3rem;
          max-width: 90%;
        }

        .slide-tags {
          flex-direction: row;
          justify-content: center;
          align-items: center;
          gap: 0.8rem;
        }

        .slide-tags p {
          font-size: 0.8rem;
          padding: 0.4rem 0.8rem;
        }

        .back-button {
          top: 80px;
          left: 1rem;
          padding: 0.6rem 1rem;
          font-size: 0.8rem;
        }

        .back-button svg {
          width: 14px;
          height: 14px;
        }

        .image-counter {
          bottom: 1rem;
          right: 1rem;
          padding: 0.6rem 1rem;
          font-size: 0.8rem;
          /* Ensure counter is always visible above mobile UI */
          z-index: 1002;
        }

        .slide-title {
          top: 3rem;
          max-width: 90%;
          /* Ensure slide content is visible above mobile UI */
          z-index: 1001;
        }

        .slide-tags {
          bottom: 3rem;
          max-width: 90%;
          /* Ensure slide content is visible above mobile UI */
          z-index: 1001;
        }

        .back-button {
          /* Ensure back button is always accessible */
          z-index: 1003;
        }
      }

      /* Fallback for browsers that don't support dvh */
      @supports not (height: 100dvh) {
        .slider {
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="navigation-bar">
      <div class="nav-arrow nav-arrow-left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15,18 9,12 15,6"></polyline>
        </svg>
      </div>
      <div class="nav-thumbnails" id="thumbnailContainer">
        <!-- Thumbnails will be dynamically generated -->
      </div>
      <div class="nav-arrow nav-arrow-right">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9,18 15,12 9,6"></polyline>
        </svg>
      </div>
    </div>

    <!-- Back to Commercial Button -->
    <a href="#" id="backToCommercial" class="back-button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15,18 9,12 15,6"></polyline>
      </svg>
      <span>Back to Commercial</span>
    </a>

    <!-- Image Counter -->
    <div class="image-counter" id="imageCounter">
        Image 1 of 79
    </div>

    <div class="slider">
      <div class="slide">
        <div class="slide-img">
          <img src="/Central Commercial Building Renovation/1.webp" alt="" loading="lazy" decoding="async" />
        </div>

        <div class="slide-title">
          <h1>Central Commercial Building Renovation</h1>
        </div>
        
        <div class="slide-tags">
          <p>Commercial development</p>
          <p>2007</p>
          <p>Remodeling 85,000 sq. ft., 2-Stories</p>
        </div>
      </div>
    </div>

    <script>
      // Get all images from cooledge directory in proper numerical order
      let slides = [];

      function naturalCompare(a, b) {
        // Simple numeric sort for sequential images (1.webp, 2.webp, 3.webp, etc.)
        const numA = parseInt(a.replace(/\.webp$/i, ''), 10);
        const numB = parseInt(b.replace(/\.webp$/i, ''), 10);
        return numA - numB;
      }

      function imageExists(url, timeout = 3500, retries = 0) {
        return new Promise((resolve) => {
          const img = new Image();
          let resolved = false;
          let timeoutId;
          
          const cleanup = () => {
            if (!resolved) {
              resolved = true;
              img.onload = null;
              img.onerror = null;
              if (timeoutId) clearTimeout(timeoutId);
            }
          };
          
          // Fast path: if image is already cached, resolve immediately
          img.onload = () => {
            cleanup();
            resolve(true);
          };
          
          img.onerror = () => {
            cleanup();
            resolve(false);
          };
          
          // Very short timeout for sequential images (they load fast or don't exist)
          timeoutId = setTimeout(() => {
            if (!resolved) {
              cleanup();
              resolve(false);
            }
          }, timeout);
          
          // Start loading immediately
          img.src = url;
        });
      }

      async function buildCentralSlides() {
        // Check cache first (valid for 24 hours)
        const cacheKey = 'central-slides-cache';
        const cacheTimestampKey = 'central-slides-cache-time';
        const cacheMaxAge = 24 * 60 * 60 * 1000; // 24 hours
        let useCache = false;
        
        try {
          const cached = localStorage.getItem(cacheKey);
          const cacheTime = localStorage.getItem(cacheTimestampKey);
          
          if (cached && cacheTime && (Date.now() - parseInt(cacheTime)) < cacheMaxAge) {
            const parsed = JSON.parse(cached);
            // Only use cache if it has a reasonable number of images (at least 40)
            // This ensures we don't use partial/incomplete scans (like 34 images)
            if (parsed && Array.isArray(parsed) && parsed.length >= 3) {
              slides = parsed;
              console.log(`✅ Using cached gallery with ${slides.length} images`);
              useCache = true;
              return; // Use cached data
            } else {
              // Cache seems incomplete, clear it and do fresh scan
              console.log(`❌ Cache has only ${parsed?.length || 0} images (need at least 3) - clearing and rescanning`);
              try {
                localStorage.removeItem(cacheKey);
                localStorage.removeItem(cacheTimestampKey);
              } catch (e) {
                // Ignore clear errors
              }
              // Continue to scan for images below
            }
          } else {
            console.log('No valid cache found - will scan for images');
          }
        } catch (e) {
          console.warn('Cache read error:', e);
          // Cache read failed, clear it and continue with fresh check
          try {
            localStorage.removeItem(cacheKey);
            localStorage.removeItem(cacheTimestampKey);
          } catch (clearErr) {
            // Ignore clear errors
          }
        }
        
        // If we're using cache, we already returned above
        // Otherwise, continue to scan for images
        console.log('Starting image scan...');

        // Mobile detection for optimized scanning
        const isMobileDevice = window.innerWidth <= 1000 || 
                              /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                              ('ontouchstart' in window);
        
        // NEW NAMING PATTERN: Simple sequential numbers (1.webp, 2.webp, 3.webp, etc.)
        // Smart range detection: Check 1-200, but use optimized approach for speed
        const maxImageNumber = 10;
        const candidates = [];
        
        // For mobile: Check in smart chunks to find actual range faster
        if (isMobileDevice) {
          // Check key points first to find the actual range
          const keyPoints = [1, 50, 100, 150, 200];
          keyPoints.forEach(i => candidates.push(`${i}.webp`));
          
          // Then fill in the rest
          for (let i = 1; i <= maxImageNumber; i++) {
            if (!keyPoints.includes(i)) {
              candidates.push(`${i}.webp`);
            }
          }
        } else {
          // Desktop: check all sequentially
          for (let i = 1; i <= maxImageNumber; i++) {
            candidates.push(`${i}.webp`);
          }
        }
        
        console.log(`⚡ Checking ${candidates.length} sequential patterns (${isMobileDevice ? 'MOBILE - SMART SCAN' : 'DESKTOP'})...`);

        const present = [];
        const candidateArray = candidates; // Already an array
        
        // ULTRA-FAST mobile caching - MAXIMUM optimization
        const batchSize = isMobileDevice ? 20 : 30; // Smaller batches for reliability
        const timeout = isMobileDevice ? 5000 : 3500; // Longer timeout to ensure all images load
        const retries = 0; // No retries
        const totalBatches = Math.ceil(candidateArray.length / batchSize);
        let currentBatch = 0;
        
        // Mobile: Cache early but ensure full scan completes
        const mobileEarlyCacheThreshold = 20; // Cache at 20 images (early but reliable)
        
        console.log(`Starting image scan (${isMobileDevice ? 'MOBILE' : 'DESKTOP'}): ${candidateArray.length} candidates in ${totalBatches} batches...`);
        console.log(`Settings: batchSize=${batchSize}, timeout=${timeout}ms, retries=${retries}`);
        
        // Reliable batch processing - ensures all images are found
        // Use batches to avoid overwhelming mobile browser/network
        for (let i = 0; i < candidateArray.length; i += batchSize) {
          currentBatch++;
          const batch = candidateArray.slice(i, i + batchSize);
          
          // Parallel checking within batch
          const batchResults = await Promise.allSettled(
            batch.map((name) => {
              const url = `/Central Commercial Building Renovation/${name}`;
              return imageExists(url, timeout, retries);
            })
          );
          
          // Process results - ensure we capture all found images
          batchResults.forEach((result, index) => {
            if (result.status === 'fulfilled' && result.value === true) {
              const imageName = batch[index];
              // Avoid duplicates
              if (!present.includes(imageName)) {
                present.push(imageName);
              }
            }
          });
          
          // Update slides array progressively (every batch)
          if (present.length > 0) {
            // Sort numerically (ensure correct order)
            const sortedPresent = [...present].sort((a, b) => {
              const numA = parseInt(a.replace('.webp', ''), 10);
              const numB = parseInt(b.replace('.webp', ''), 10);
              return numA - numB;
            });
            
            // Always update slides array (ensures all images are included)
            slides = sortedPresent.map((image) => {
              const imageNumber = image.replace(/\.webp$/i, '');
              return {
                slideTitle: `Central Commercial Building Renovation`,
                slideDescription: `Documentation of the Central Commercial Building Renovation development project, showcasing the comprehensive construction and design process.`,
                slideImg: `/Central Commercial Building Renovation/${image}`,
              };
            });
            
            // MOBILE: Early cache when we have enough (but continue scan)
            if (isMobileDevice && present.length >= mobileEarlyCacheThreshold && 
                currentBatch < totalBatches && !window._mobileEarlyCached) {
              try {
                localStorage.setItem(cacheKey + '_temp', JSON.stringify(slides));
                window._mobileEarlyCached = true;
                console.log(`📱 ⚡ Early cached ${slides.length} images (temporary - full scan continuing...)`);
              } catch (e) {
                // Ignore cache errors
              }
            }
            
            // Trigger UI update
            window.dispatchEvent(new CustomEvent('slidesUpdated', { 
              detail: { 
                count: slides.length,
                present: [...sortedPresent]
              } 
            }));
          }
          
          // Progress logging
          if (currentBatch === 1 || currentBatch === totalBatches || (currentBatch % 3 === 0 && isMobileDevice)) {
            console.log(`⚡ ${currentBatch}/${totalBatches} batches → ${present.length} images found`);
          }
        }
        
        console.log(`✅ Scan complete! Found ${present.length} images total.`);
        
        // Ensure we have all images - remove duplicates and sort
        const uniquePresent = [...new Set(present)]; // Remove any duplicates
        uniquePresent.sort((a, b) => {
          const numA = parseInt(a.replace('.webp', ''), 10);
          const numB = parseInt(b.replace('.webp', ''), 10);
          return numA - numB;
        });
        
        // Final slides array - ALWAYS use complete scan results
        slides = uniquePresent.map((image) => {
          const imageNumber = image.replace(/\.webp$/i, '');
          return {
            slideTitle: `Central Commercial Building Renovation`,
            slideDescription: `Documentation of the Central Commercial Building Renovation development project, showcasing the comprehensive construction and design process.`,
            slideImg: `/Central Commercial Building Renovation/${image}`,
          };
        });
        
        // Log final result with details
        console.log(`✅ Final result: ${slides.length} images found and sorted`);
        console.log(`   Image range: ${uniquePresent[0]} to ${uniquePresent[uniquePresent.length - 1]}`);
        
        // Warn if we found fewer than expected
        if (slides.length < 40) {
          console.warn(`⚠️ Only found ${slides.length} images. Expected 40+.`);
          console.warn(`⚠️ This cache will be rejected. Clear cache and rescan to find all images.`);
        } else {
          console.log(`✅ Found ${slides.length} images - complete scan!`);
        }
        
        // Cache final results - ALWAYS overwrite any early/temporary cache
        // Only cache if we found a reasonable number (prevents partial caches)
        if (slides.length >= 40) {
          try {
            // Remove any temporary early cache
            try {
              localStorage.removeItem(cacheKey + '_temp');
            } catch (e) {
              // Ignore
            }
            
            // Save final complete cache
            localStorage.setItem(cacheKey, JSON.stringify(slides));
            localStorage.setItem(cacheTimestampKey, Date.now().toString());
            console.log(`✅ Successfully cached ${slides.length} images (FINAL - complete scan)`);
            
            // Verify all images are in correct order
            const imageNumbers = slides.map(s => parseInt(s.slideImg.match(/(\d+)\.webp/)?.[1] || '0', 10)).filter(n => n > 0);
            if (imageNumbers.length > 0) {
              const min = Math.min(...imageNumbers);
              const max = Math.max(...imageNumbers);
              const gaps = [];
              for (let i = min; i <= max; i++) {
                if (!imageNumbers.includes(i)) {
                  gaps.push(i);
                }
              }
              if (gaps.length > 0) {
                console.warn(`⚠️ Missing images: ${gaps.slice(0, 10).join(', ')}${gaps.length > 10 ? '...' : ''} (${gaps.length} total gaps)`);
              } else {
                console.log(`✅ All images found in range ${min}-${max} (${imageNumbers.length} total, no gaps)`);
              }
            }
          } catch (e) {
            console.warn('Failed to cache slides:', e);
          }
        } else {
          console.warn(`⚠️ Only found ${slides.length} images - NOT caching (need at least 40)`);
          console.warn(`⚠️ This prevents partial caches. Clear cache and let full scan complete.`);
          
          // Don't cache partial results - force fresh scan next time
          try {
            localStorage.removeItem(cacheKey);
            localStorage.removeItem(cacheTimestampKey);
            localStorage.removeItem(cacheKey + '_temp');
          } catch (e) {
            // Ignore
          }
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        // Set back button link based on device type
        const backButton = document.getElementById('backToCommercial');
        const isMobile = window.innerWidth <= 1000 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (backButton) {
          backButton.href = isMobile ? 'commercial-mobile.html' : 'commercial.html';
        }
        
        // Initialize with cached data if available (for instant load)
        // But be strict - only use cache if it has images
        const cacheKey = 'central-slides-cache';
        let hasInitialCache = false;
        try {
          const cached = localStorage.getItem(cacheKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            // Only use cache if it has images (strict check)
            if (parsed && Array.isArray(parsed) && parsed.length > 0) {
              slides = parsed;
              hasInitialCache = true;
              console.log(`Loaded ${slides.length} images from cache for initial display`);
            } else {
              // Bad cache - clear it
              console.log('Cache exists but is empty or invalid - clearing');
              localStorage.removeItem(cacheKey);
              localStorage.removeItem('central-slides-cache-time');
            }
          }
        } catch (e) {
          console.warn('Cache read error:', e);
          // Clear bad cache
          try {
            localStorage.removeItem(cacheKey);
            localStorage.removeItem('central-slides-cache-time');
          } catch (clearErr) {
            // Ignore
          }
        }
        
        // If no valid cache, show loading message
        if (!hasInitialCache || slides.length === 0) {
          slides = []; // Ensure it's empty array, not undefined
          const imageCounterEl = document.getElementById('imageCounter');
          if (imageCounterEl) {
            imageCounterEl.textContent = 'Scanning for images...';
          }
          console.log('No valid cache - will scan for images');
        }
        
        // Better mobile viewport handling for address bar
        if (window.innerHeight < 800) { // Mobile device
          // Use a more reliable method to handle mobile viewport
          const setViewportHeight = () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
          };
          
          setViewportHeight();
          window.addEventListener('resize', setViewportHeight);
          window.addEventListener('orientationchange', () => {
            setTimeout(setViewportHeight, 100);
          });
        }

        // Use a getter function for totalSlides so it always reflects current slides.length
        const getTotalSlides = () => slides.length;
        let currentSlide = 1;
        let currentPage = 0; // Current page of thumbnails (0-4)
        const slidesPerPage = 5;

        let isAnimating = false;
        let scrollAllowed = true;
        let lastScrollTime = 0;

        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const leftArrow = document.querySelector('.nav-arrow-left');
        const rightArrow = document.querySelector('.nav-arrow-right');

        function generateThumbnails() {
          thumbnailContainer.innerHTML = '';
          const startIndex = currentPage * slidesPerPage;
          const endIndex = Math.min(startIndex + slidesPerPage, getTotalSlides());

          for (let i = startIndex; i < endIndex; i++) {
            const thumbnail = document.createElement('div');
            thumbnail.className = 'thumbnail';
            thumbnail.setAttribute('data-slide', i + 1);

            const img = document.createElement('img');
            img.src = slides[i].slideImg;
            img.alt = slides[i].slideTitle;
            img.loading = 'lazy';
            img.decoding = 'async';
            thumbnail.appendChild(img);

            thumbnailContainer.appendChild(thumbnail);
          }
        }

        function updateNavigation() {
          const thumbnails = document.querySelectorAll('.thumbnail');
          thumbnails.forEach((thumb) => {
            const slideIndex = parseInt(thumb.getAttribute('data-slide'));
            thumb.classList.toggle('active', slideIndex === currentSlide);
          });
        }

        function updateImageCounter() {
          const imageCounter = document.getElementById('imageCounter');
          imageCounter.textContent = `Image ${currentSlide} of ${getTotalSlides()}`;
        }

        function updateCurrentPage() {
          currentPage = Math.floor((currentSlide - 1) / slidesPerPage);
        }

        function createSlide(slideNumber) {
          const slide = document.createElement("div");
          slide.className = "slide";

          const slideData = slides[slideNumber - 1];

          slide.innerHTML = `
            <div class="slide-img">
              <img src="${slideData.slideImg}" alt="" loading="lazy" decoding="async" />
            </div>

            <div class="slide-title">
              <h1>${slideData.slideTitle}</h1>
            </div>
            
            <div class="slide-tags">
              <p>3-Stories</p>
              <p>2024</p>
              <p>50,000 sq. ft.</p>
            </div>
          `;

          return slide;
        }

        function splitText(slide) {
          const title = slide.querySelector("h1");
          const description = slide.querySelector("p");

          if (title) {
            const titleText = title.textContent;
            title.innerHTML = titleText
              .split(" ")
              .map((word) => `<span class="word">${word}</span>`)
              .join(" ");
          }

          if (description) {
            const descText = description.textContent;
            description.innerHTML = descText
              .split(" ")
              .map((word) => `<span class="word">${word}</span>`)
              .join(" ");
          }
        }

        function animateSlide(direction) {
          if (isAnimating || !scrollAllowed) return;
          if (Date.now() - lastScrollTime < 150) return;

          isAnimating = true;
          scrollAllowed = false;

          const slider = document.querySelector(".slider");
          const currentSlideElement = slider.querySelector(".slide");

          const exitY = direction === "down" ? "-200vh" : "200vh";
          const entryY = direction === "down" ? "100vh" : "-100vh";
          const entryClipPath =
            direction === "down"
              ? "polygon(20% 20%, 80% 20%, 80% 100%, 20% 100%)"
              : "polygon(20% 0%, 80% 0%, 80% 80%, 20% 80%)";

          currentSlideElement.style.transform = `scale(0.25) translateY(${exitY}) rotate(30deg)`;
          currentSlideElement.style.transition = "all 0.5s ease-in-out";
          currentSlideElement.style.opacity = "0";

          setTimeout(() => {
            currentSlideElement.remove();

            if (direction === "down") {
              currentSlide = currentSlide === getTotalSlides() ? 1 : currentSlide + 1;
            } else {
              currentSlide = currentSlide === 1 ? getTotalSlides() : currentSlide - 1;
            }

            const newSlide = createSlide(currentSlide);

            newSlide.style.transform = `translateY(${entryY})`;
            newSlide.style.clipPath = entryClipPath;
            newSlide.style.transition = "all 0.4s ease-out";

            slider.appendChild(newSlide);

            splitText(newSlide);

            const words = newSlide.querySelectorAll(".word");

            words.forEach((word) => {
              word.style.transform = "translateY(100%)";
              word.style.transition = "transform 0.3s ease-out";
            });

            setTimeout(() => {
              newSlide.style.transform = "translateY(0)";
              newSlide.style.clipPath = "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)";

              setTimeout(() => {
                words.forEach((word, index) => {
                  setTimeout(() => {
                    word.style.transform = "translateY(0)";
                  }, index * 30);
                });
                
                // Re-trigger slide-tags animations
                const slideTags = newSlide.querySelectorAll(".slide-tags p");
                slideTags.forEach((tag) => {
                  tag.style.animation = "none";
                  setTimeout(() => {
                    tag.style.animation = "";
                  }, 10);
                });
              }, 200);
            }, 50);

            setTimeout(() => {
              isAnimating = false;
              updateCurrentPage();
              generateThumbnails();
              updateNavigation();
              updateImageCounter();
              setTimeout(() => {
                scrollAllowed = true;
                lastScrollTime = Date.now();
              }, 10);
            }, 400);
          }, 500);
        }

        // Function to jump directly to a specific slide with same animation as original
        function jumpToSlide(targetSlide) {
          if (isAnimating || !scrollAllowed) return;
          if (targetSlide === currentSlide) return;

          isAnimating = true;
          scrollAllowed = false;

          const slider = document.querySelector(".slider");
          const currentSlideElement = slider.querySelector(".slide");

          const direction = targetSlide > currentSlide ? "down" : "up";
          const exitY = direction === "down" ? "-200vh" : "200vh";
          const entryY = direction === "down" ? "100vh" : "-100vh";
          const entryClipPath =
            direction === "down"
              ? "polygon(20% 20%, 80% 20%, 80% 100%, 20% 100%)"
              : "polygon(20% 0%, 80% 0%, 80% 80%, 20% 80%)";

          currentSlideElement.style.transform = `scale(0.25) translateY(${exitY}) rotate(30deg)`;
          currentSlideElement.style.transition = "all 0.5s ease-in-out";
          currentSlideElement.style.opacity = "0";

          setTimeout(() => {
            currentSlideElement.remove();
            currentSlide = targetSlide;
            const newSlide = createSlide(currentSlide);

            newSlide.style.transform = `translateY(${entryY})`;
            newSlide.style.clipPath = entryClipPath;
            newSlide.style.transition = "all 0.4s ease-out";

            slider.appendChild(newSlide);

            splitText(newSlide);

            const words = newSlide.querySelectorAll(".word");

            words.forEach((word) => {
              word.style.transform = "translateY(100%)";
              word.style.transition = "transform 0.3s ease-out";
            });

            setTimeout(() => {
              newSlide.style.transform = "translateY(0)";
              newSlide.style.clipPath = "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)";

              setTimeout(() => {
                words.forEach((word, index) => {
                  setTimeout(() => {
                    word.style.transform = "translateY(0)";
                  }, index * 30);
                });
                
                // Re-trigger slide-tags animations
                const slideTags = newSlide.querySelectorAll(".slide-tags p");
                slideTags.forEach((tag) => {
                  tag.style.animation = "none";
                  setTimeout(() => {
                    tag.style.animation = "";
                  }, 10);
                });
              }, 200);
            }, 50);

            setTimeout(() => {
              isAnimating = false;
              updateCurrentPage();
              generateThumbnails();
              updateNavigation();
              updateImageCounter();
              setTimeout(() => {
                scrollAllowed = true;
                lastScrollTime = Date.now();
              }, 10);
            }, 400);
          }, 500);
        }

        // Thumbnail click handler
        if (thumbnailContainer) {
          thumbnailContainer.addEventListener('click', (e) => {
            const thumbnail = e.target.closest('.thumbnail');
            if (thumbnail && getTotalSlides() > 0) {
              const targetSlide = parseInt(thumbnail.getAttribute('data-slide'));
              if (targetSlide && targetSlide <= getTotalSlides()) {
                jumpToSlide(targetSlide);
              }
            }
          });
        }

        // Arrow navigation
        if (leftArrow) {
          leftArrow.addEventListener('click', () => {
            if (isAnimating || !scrollAllowed || getTotalSlides() === 0) return;

            // Go to first image of previous 5
            let newSlide = Math.floor((currentSlide - 1) / slidesPerPage) * slidesPerPage;
            if (newSlide < 1) {
              // If we go below 1, wrap to the last page
              newSlide = Math.floor((getTotalSlides() - 1) / slidesPerPage) * slidesPerPage + 1;
            }
            
            const newPage = Math.floor((newSlide - 1) / slidesPerPage);
            if (newPage !== currentPage) {
              currentPage = newPage;
              generateThumbnails();
            }
            
            jumpToSlide(newSlide);
          });
        }

        if (rightArrow) {
          rightArrow.addEventListener('click', () => {
            if (isAnimating || !scrollAllowed || getTotalSlides() === 0) return;

            // Go to first image of next 5
            let newSlide = Math.floor((currentSlide - 1) / slidesPerPage) * slidesPerPage + slidesPerPage + 1;
            if (newSlide > getTotalSlides()) {
              // If we go above total, wrap to the beginning
              newSlide = 1;
            }
            
            const newPage = Math.floor((newSlide - 1) / slidesPerPage);
            if (newPage !== currentPage) {
              currentPage = newPage;
              generateThumbnails();
            }
            
            jumpToSlide(newSlide);
          });
        }

        // Mouse wheel navigation with throttling
        let wheelTimeout;
        window.addEventListener("wheel", (e) => {
          if (isAnimating || !scrollAllowed) return;
          if (Date.now() - lastScrollTime < 150) return;

          // Throttle wheel events for smoother performance
          clearTimeout(wheelTimeout);
          wheelTimeout = setTimeout(() => {
            const direction = e.deltaY > 0 ? "down" : "up";
            animateSlide(direction);
          }, 16); // ~60fps throttling
        }, { passive: true });

        // Touch navigation with improved sensitivity
        let touchStartY = 0;
        let touchStartTime = 0;
        let touchMoved = false;

        window.addEventListener("touchstart", (e) => {
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
          touchMoved = false;
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
          touchMoved = true;
        }, { passive: true });

        window.addEventListener("touchend", (e) => {
          if (isAnimating || !scrollAllowed || !touchMoved) return;
          if (Date.now() - lastScrollTime < 120) return;

          const touchEndY = e.changedTouches[0].clientY;
          const touchEndTime = Date.now();
          const deltaY = touchStartY - touchEndY;
          const deltaTime = touchEndTime - touchStartTime;

          // Improved touch sensitivity
          if (Math.abs(deltaY) > 40 && deltaTime < 400) {
            const direction = deltaY > 0 ? "down" : "up";
            animateSlide(direction);
          }
        }, { passive: true });

        // Mobile viewport handling - no more problematic scroll-based address bar hiding

        // Initialize the gallery immediately with cached data (if available)
        // This makes the page appear instantly on mobile
        if (slides.length > 0) {
          generateThumbnails();
          updateNavigation();
          updateImageCounter();
        } else {
          // Even if no slides yet, initialize the UI so gallery is ready
          updateImageCounter();
        }
        
        // Listen for progressive slide updates during scan
        // Throttle updates to avoid performance issues on mobile
        let lastUpdateTime = 0;
        const updateThrottle = 300; // Update UI max once per 300ms (faster updates)
        
        window.addEventListener('slidesUpdated', function(e) {
          const now = Date.now();
          if (now - lastUpdateTime < updateThrottle) return;
          lastUpdateTime = now;
          
          const count = e.detail.count;
          const presentArray = e.detail.present;
          
          if (count > 0 && presentArray && presentArray.length > 0) {
            // Use numeric sort for sequential images (consistent with scan)
            const sortedArray = [...presentArray].sort((a, b) => {
              const numA = parseInt(a.replace('.webp', ''), 10);
              const numB = parseInt(b.replace('.webp', ''), 10);
              return numA - numB;
            });
            
            // Only update if we have more images than before (prevents missing images)
            if (sortedArray.length >= slides.length) {
              slides = sortedArray.map((image) => {
                const imageNumber = image.replace(/\.webp$/i, '');
                return {
                  slideTitle: `Central Commercial Building Renovation`,
                  slideDescription: `Documentation of the Central Commercial Building Renovation development project, showcasing the comprehensive construction and design process.`,
                  slideImg: `/Central Commercial Building Renovation/${image}`,
                };
              });
              
              updateImageCounter();
              if (currentSlide === 1 && slides.length > 0) {
                updateCurrentPage();
                generateThumbnails();
                updateNavigation();
                
                // Create first slide if it doesn't exist
                const slider = document.querySelector(".slider");
                if (slider && !slider.querySelector(".slide")) {
                  const firstSlide = createSlide(1);
                  slider.appendChild(firstSlide);
                  splitText(firstSlide);
                }
              }
            }
          }
        });
        
        // Build slide manifest in background (non-blocking)
        // Images will appear progressively as they're found
        buildCentralSlides().then(() => {
          console.log(`buildCentralSlides completed with ${slides.length} slides`);
          
          // Final update when scan completes
          updateImageCounter();
          
          if (slides.length > 0) {
            // Final gallery update
            updateCurrentPage();
            generateThumbnails();
            updateNavigation();
            
            // Ensure first slide is displayed
            const slider = document.querySelector(".slider");
            if (slider) {
              const existingSlide = slider.querySelector(".slide");
              if (!existingSlide || currentSlide === 1) {
                if (existingSlide) {
                  existingSlide.remove();
                }
                const firstSlide = createSlide(1);
                slider.appendChild(firstSlide);
                splitText(firstSlide);
              }
            }
          } else {
            // No slides found - show message
            const imageCounterEl = document.getElementById('imageCounter');
            if (imageCounterEl) {
              imageCounterEl.textContent = 'No images found. Check console.';
              imageCounterEl.style.background = 'rgba(255, 0, 0, 0.3)';
            }
            console.error('No images found! Check network connection and image paths.');
          }
        }).catch(err => {
          console.error('Error building slides:', err);
          updateImageCounter();
          if (slides.length > 0) {
            updateCurrentPage();
            generateThumbnails();
            updateNavigation();
          } else {
            const imageCounterEl = document.getElementById('imageCounter');
            if (imageCounterEl) {
              imageCounterEl.textContent = 'Error loading images';
              imageCounterEl.style.background = 'rgba(255, 0, 0, 0.3)';
            }
          }
        });
      });
    </script>
  </body>
</html>

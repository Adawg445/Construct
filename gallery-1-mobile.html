<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZDEVCO</title>
    <link rel="icon" type="image/svg+xml" href="/navigation bar/Cube.svg">
    <script src="loader.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        font-family: "DM Sans", sans-serif;
        background-color: #000;
        overflow: hidden;
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100);
        width: 100vw;
        margin: 0;
        padding: 0;
        /* Performance optimizations */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Hardware acceleration */
        transform: translateZ(0);
        backface-visibility: hidden;
        perspective: 1000px;
      }

      .navigation-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100px;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .nav-arrow {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        color: white;
      }

      .nav-arrow:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
      }

      .nav-arrow svg {
        width: 24px;
        height: 24px;
      }

      .nav-thumbnails {
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .thumbnail {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }

      .thumbnail:hover {
        transform: scale(1.1);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .thumbnail.active {
        border-color: #fff;
        transform: scale(1.1);
      }

      .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        max-width: 1920px;
        max-height: 1080px;
      }

      .slider {
        position: fixed;
        top: 100px;
        left: 0;
        width: 100vw;
        height: calc(100vh - 100px);
        height: calc(calc(var(--vh, 1vh) * 100) - 100px);
        background-color: #000;
        overflow: hidden;
      }

      .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        will-change: transform, opacity;
        /* Hardware acceleration for smoother animations */
        transform: translateZ(0);
        backface-visibility: hidden;
        /* Optimize for animations */
        contain: layout style paint;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .slide-img {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
        background-color: #000;
      }

      .slide-title {
        position: absolute;
        top: 4rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: white;
        z-index: 100;
        max-width: 80%;
      }

      .slide-tags {
        position: absolute;
        bottom: 4rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: white;
        z-index: 100;
        max-width: 80%;
        margin-top: 0;
      }

      .slide-title h1 {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 1rem;
        font-family: "DM Sans", sans-serif;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .slide-description p {
        font-size: 1.2rem;
        line-height: 1.6;
        opacity: 0.9;
        max-width: 600px;
        margin: 0 auto;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }

      .slide-tags {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .slide-tags p {
        background: rgba(255, 255, 255, 0.1);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.9rem;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        margin: 0;
        transition: all 0.3s ease;
        opacity: 0;
        transform: translateY(20px);
        animation: slideInUp 0.6s ease forwards;
      }

      .slide-tags p:nth-child(1) {
        animation-delay: 0.2s;
        order: 1;
      }

      .slide-tags p:nth-child(2) {
        animation-delay: 0.4s;
        order: 2;
      }

      .slide-tags p:nth-child(3) {
        animation-delay: 0.6s;
        order: 3;
      }

      @keyframes slideInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .line,
      .word {
        position: relative;
        display: inline-block;
        will-change: transform;
        /* Optimize text animations */
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      /* Back to Commercial Button */
      .back-button {
        position: fixed;
        top: 100px;
        left: 2rem;
        z-index: 1001;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 0.8rem 1.5rem;
        color: #fff;
        text-decoration: none;
        font-family: "DM Mono", monospace;
        font-size: 0.9rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: -0.01rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .back-button:hover {
        background: #fff;
        color: #000;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
      }

      .back-button svg {
        width: 16px;
        height: 16px;
        transition: transform 0.3s ease;
      }

      .back-button:hover svg {
        transform: translateX(-3px);
      }

      /* Image Counter */
      .image-counter {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 1001;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 0.8rem 1.5rem;
        color: #fff;
        font-family: "DM Mono", monospace;
        font-size: 0.9rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: -0.01rem;
        transition: all 0.3s ease;
      }

      /* Mobile Responsive */
      @media (max-width: 1000px) {
        .navigation-bar {
          height: 80px;
          padding: 0 1rem;
        }

        .slider {
          top: 80px;
          height: calc(100vh - 80px);
          height: calc(calc(var(--vh, 1vh) * 100) - 80px);
        }

        .slide {
          height: 100%;
        }

        .nav-arrow {
          width: 40px;
          height: 40px;
        }

        .nav-arrow svg {
          width: 20px;
          height: 20px;
        }

        .thumbnail {
          width: 40px;
          height: 40px;
        }

        .nav-thumbnails {
          gap: 0.5rem;
        }

        .slide-title h1 {
          font-size: 2rem;
        }

        .slide-description p {
          font-size: 1rem;
        }

        .slide-title {
          top: 3rem;
          max-width: 90%;
        }

        .slide-tags {
          bottom: 3rem;
          max-width: 90%;
        }

        .slide-tags {
          flex-direction: row;
          justify-content: center;
          align-items: center;
          gap: 0.8rem;
        }

        .slide-tags p {
          font-size: 0.8rem;
          padding: 0.4rem 0.8rem;
        }

        .back-button {
          top: 80px;
          left: 1rem;
          padding: 0.6rem 1rem;
          font-size: 0.8rem;
        }

        .back-button svg {
          width: 14px;
          height: 14px;
        }

        .image-counter {
          bottom: 1rem;
          right: 1rem;
          padding: 0.6rem 1rem;
          font-size: 0.8rem;
          /* Ensure counter is always visible above mobile UI */
          z-index: 1002;
        }

        .slide-title {
          top: 3rem;
          max-width: 90%;
          /* Ensure slide content is visible above mobile UI */
          z-index: 1001;
        }

        .slide-tags {
          bottom: 3rem;
          max-width: 90%;
          /* Ensure slide content is visible above mobile UI */
          z-index: 1001;
        }

        .back-button {
          /* Ensure back button is always accessible */
          z-index: 1003;
        }
      }

      /* Fallback for browsers that don't support dvh */
      @supports not (height: 100dvh) {
        .slider {
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="navigation-bar">
      <div class="nav-arrow nav-arrow-left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15,18 9,12 15,6"></polyline>
        </svg>
      </div>
      <div class="nav-thumbnails" id="thumbnailContainer">
        <!-- Thumbnails will be dynamically generated -->
      </div>
      <div class="nav-arrow nav-arrow-right">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9,18 15,12 9,6"></polyline>
        </svg>
      </div>
    </div>

    <!-- Back to Commercial Button -->
    <a href="#" id="backToCommercial" class="back-button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15,18 9,12 15,6"></polyline>
      </svg>
      <span>Back to Commercial</span>
    </a>

    <!-- Image Counter -->
    <div class="image-counter" id="imageCounter">
        Image 1 of 79
    </div>

    <div class="slider">
      <div class="slide">
        <div class="slide-img">
          <img src="/Cooledge_Mobile/1.webp" alt="" loading="lazy" decoding="async" />
        </div>

        <div class="slide-title">
          <h1>Grandview Casa Blanca South</h1>
        </div>
        
        <div class="slide-tags">
          <p>Commercial Development</p>
          <p>2021-2023</p>
          <p>100,000 sq. ft., 116 units 3-Stories</p>
        </div>
      </div>
    </div>

    <script>
      // Get all images from cooledge directory in proper numerical order
      let slides = [];

      function naturalCompare(a, b) {
        // Robust numeric natural order: 1.webp, 2.webp, 5.webp, 5-1.webp, 5-2.webp, 5-27-1.webp, 6.webp, 6-1.webp, ..., 6-24.webp, 7.webp, ..., 23.webp, 24.webp, 25.webp, ...
        const toKey = (name) => name
          .replace(/\.webp$/i, '')
          .split(/[^0-9]+/) // split on non-digits to capture multi-part numbers
          .filter(Boolean)
          .map((n) => parseInt(n, 10));
        const ak = toKey(a);
        const bk = toKey(b);
        const len = Math.max(ak.length, bk.length);
        for (let i = 0; i < len; i++) {
          const av = ak[i] !== undefined ? ak[i] : -1; // base image comes before dashed variants
          const bv = bk[i] !== undefined ? bk[i] : -1;
          if (av !== bv) return av - bv;
        }
        return a.localeCompare(b);
      }

      function imageExists(url, timeout = 10000, retries = 2) {
        return new Promise((resolve) => {
          const img = new Image();
          let resolved = false;
          let timeoutId;
          
          const cleanup = () => {
            if (!resolved) {
              resolved = true;
              img.onload = null;
              img.onerror = null;
              if (timeoutId) clearTimeout(timeoutId);
            }
          };
          
          // Fast path: if image is already cached, resolve immediately
          img.onload = () => {
            cleanup();
            resolve(true);
          };
          
          img.onerror = () => {
            cleanup();
            // Retry logic for mobile networks
            if (retries > 0) {
              setTimeout(() => {
                imageExists(url, timeout, retries - 1).then(resolve);
              }, 500);
            } else {
              resolve(false);
            }
          };
          
          // Longer timeout for mobile/iOS (5 seconds default)
          timeoutId = setTimeout(() => {
            if (!resolved) {
              cleanup();
              // Retry on timeout for mobile
              if (retries > 0) {
                setTimeout(() => {
                  imageExists(url, timeout, retries - 1).then(resolve);
                }, 500);
              } else {
                resolve(false);
              }
            }
          }, timeout);
          
          // Start loading immediately
          img.src = url;
        });
      }

      async function buildCooledgeMobileSlides() {
        const cacheKey = 'cooledge-mobile-slides-cache';
        const cacheTimestampKey = 'cooledge-mobile-slides-cache-time';
        const cacheMaxAge = 24 * 60 * 60 * 1000; // 24 hours
        let hasInitialCache = false;

        try {
          const cached = localStorage.getItem(cacheKey);
          const cacheTime = localStorage.getItem(cacheTimestampKey);

          if (cached && cacheTime && (Date.now() - parseInt(cacheTime)) < cacheMaxAge) {
            const parsed = JSON.parse(cached);
            // Only use cache if it has a reasonable number of images (at least 15 for mobile)
            // Mobile folder has 21 images, so 15 is a good threshold (allows for some missing)
            if (parsed && Array.isArray(parsed) && parsed.length >= 15) {
              slides = parsed;
              console.log(`Using cached gallery with ${slides.length} images`);
              hasInitialCache = true;
              // No return here, always run scan to ensure full set and update cache
            } else {
              console.log(`Cache has only ${parsed?.length || 0} images (need at least 15) - clearing and rescanning`);
              localStorage.removeItem(cacheKey);
              localStorage.removeItem(cacheTimestampKey);
            }
          } else {
            if (cached) {
              console.log('Cache expired or invalid timestamp - will scan for images');
            } else {
              console.log('No valid cache found - will scan for images');
            }
          }
        } catch (e) {
          console.warn('Cache read error:', e);
          localStorage.removeItem(cacheKey);
          localStorage.removeItem(cacheTimestampKey);
        }

        // If no valid cache, show loading message
        if (!hasInitialCache || slides.length === 0) {
          slides = []; // Ensure it's empty array, not undefined
          const imageCounterEl = document.getElementById('imageCounter');
          if (imageCounterEl) {
            imageCounterEl.textContent = 'Scanning for images...';
          }
        }

        // FORCE mobile mode for mobile gallery (always use mobile settings)
        const isMobileDevice = true; // Always mobile for mobile gallery file
        
        // NEW NAMING PATTERN: Simple sequential numbers (1.webp, 2.webp, 3.webp, etc.)
        // Mobile folder has sequential images 1-21, so check only that range for speed
        const maxImageNumber = 21; // Exact range - images are 1-21
        const candidates = [];
        
        // For mobile: Check all numbers sequentially (images are 1-21, all sequential)
        // Check all numbers from 1 to maxImageNumber
        for (let i = 1; i <= maxImageNumber; i++) {
          candidates.push(`${i}.webp`);
        }
        
        console.log(`⚡ Checking ${candidates.length} sequential patterns (${isMobileDevice ? 'MOBILE - SMART SCAN' : 'DESKTOP'})...`);

        const present = [];
        const candidateArray = candidates; // Already an array
        
        // Detect base path for local network access (do this early so it's available everywhere)
        // Start with absolute path (works better with Vite)
        let imageBasePath = '/Cooledge_Mobile';
        const basePath = window.location.origin;
        console.log(`Base URL: ${basePath}`);
        console.log(`Initial image base path: ${imageBasePath}`);
        
        console.log(`Starting image scan (${isMobileDevice ? 'MOBILE' : 'DESKTOP'}): ${candidateArray.length} candidates...`);
        
        // For mobile: Process images SEQUENTIALLY (one at a time) to avoid network overload
        const timeout = isMobileDevice ? 10000 : 1500; // 10s timeout for mobile/iOS
        const retries = isMobileDevice ? 2 : 0;
        
        console.log(`Starting image scan (${isMobileDevice ? 'MOBILE - SEQUENTIAL' : 'DESKTOP'}): ${candidateArray.length} candidates...`);
        console.log(`Settings: timeout=${timeout}ms, retries=${retries}`);
        console.log(`Processing images one at a time for reliability...`);
        
        // Mobile: Cache immediately when we find images (mobile folders are small)
        const mobileEarlyCacheThreshold = 5; // Cache when we find 5 images
        
        // Process images SEQUENTIALLY on mobile (one at a time) for maximum reliability
        try {
          for (let i = 0; i < candidateArray.length; i++) {
            const name = candidateArray[i];
            const url = `/Cooledge_Mobile/${name}`;
            
            // Check image one at a time
            const exists = await imageExists(url, timeout, retries);
            
            if (exists) {
              if (!present.includes(name)) {
                present.push(name);
                console.log(`✅ Found: ${name} (${present.length}/${candidateArray.length})`);
              }
            } else {
              // Only log missing images occasionally to avoid spam
              if (i < 5 || i % 5 === 0) {
                console.log(`❌ Not found: ${name}`);
              }
            }
            
            // Update slides array progressively
            if (present.length > 0) {
              // Sort numerically
              const sortedPresent = [...present].sort((a, b) => {
                const numA = parseInt(a.replace('.webp', ''), 10);
                const numB = parseInt(b.replace('.webp', ''), 10);
                return numA - numB;
              });
              
              // Always update slides array
              slides = sortedPresent.map((image) => {
                const imageNumber = image.replace(/\.webp$/i, '');
                return {
                  slideTitle: `Grandview Casa Blanca South`,
                  slideDescription: `Documentation of the Grandview Casa Blanca South development project, showcasing the comprehensive construction and design process.`,
                  slideImg: `/Cooledge_Mobile/${image}`,
                };
              });
              
              // MOBILE: Early cache when we have enough (but continue scan)
              if (isMobileDevice && present.length >= mobileEarlyCacheThreshold && 
                  i < candidateArray.length - 1 && !window._mobileEarlyCached) {
                try {
                  localStorage.setItem(cacheKey + '_temp', JSON.stringify(slides));
                  window._mobileEarlyCached = true;
                  console.log(`📱 ⚡ Early cached ${slides.length} images (temporary - scan continuing...)`);
                } catch (e) {
                  // Ignore cache errors
                }
              }
              
              // Trigger UI update every 3 images found
              if (present.length % 3 === 0 || i === candidateArray.length - 1) {
                window.dispatchEvent(new CustomEvent('slidesUpdated', { 
                  detail: { 
                    count: slides.length,
                    present: [...sortedPresent]
                  } 
                }));
              }
            }
            
            // Small delay between images on mobile to avoid overwhelming network
            if (isMobileDevice && i < candidateArray.length - 1) {
              await new Promise(resolve => setTimeout(resolve, 200));
            }
            
            // Progress logging
            if ((i + 1) % 5 === 0 || i === candidateArray.length - 1) {
              console.log(`⚡ Progress: ${i + 1}/${candidateArray.length} checked → ${present.length} images found`);
            }
          }
        } catch (err) {
          console.error('Error during sequential processing:', err);
          console.error('Error stack:', err.stack);
          // Continue with whatever images we found so far
        }
        
        console.log(`✅ Scan complete! Found ${present.length} images total.`);
        
        // Ensure we have all images - remove duplicates and sort
        const uniquePresent = [...new Set(present)]; // Remove any duplicates
        uniquePresent.sort((a, b) => {
          const numA = parseInt(a.replace('.webp', ''), 10);
          const numB = parseInt(b.replace('.webp', ''), 10);
          return numA - numB;
        });
        
        // Final slides array - ALWAYS use complete scan results
        slides = uniquePresent.map((image) => {
          const imageNumber = image.replace(/\.webp$/i, '');
          return {
            slideTitle: `Grandview Casa Blanca South`,
            slideDescription: `Documentation of the Grandview Casa Blanca South development project, showcasing the comprehensive construction and design process.`,
            slideImg: `/Cooledge_Mobile/${image}`,
          };
        });
        
        // Log final result with details
        console.log(`✅ Final result: ${slides.length} images found and sorted`);
        console.log(`   Image range: ${uniquePresent[0]} to ${uniquePresent[uniquePresent.length - 1]}`);
        
        // Verify image sequence for gaps
        const imageNumbers = slides.map(s => parseInt(s.slideImg.match(/(\d+)\.webp/)?.[1] || '0', 10)).filter(n => n > 0);
        if (imageNumbers.length > 0) {
          const min = Math.min(...imageNumbers);
          const max = Math.max(...imageNumbers);
          const expected = max - min + 1;
          if (imageNumbers.length < expected) {
            const missing = [];
            for (let i = min; i <= max; i++) {
              if (!imageNumbers.includes(i)) {
                missing.push(`${i}.webp`);
              }
            }
            console.warn(`⚠️ Found ${imageNumbers.length} images but expected ${expected} (range ${min}-${max}). Missing: ${missing.join(', ')}`);
          } else {
            console.log(`✅ All images found in range ${min}-${max} (${imageNumbers.length} total)`);
          }
        }

        console.log(`✅ Final result: ${slides.length} images in Cooledge_Mobile directory`);

        // Cache final results - ALWAYS overwrite any early/temporary cache
        // Only cache if we found a reasonable number of images (15+ out of 21)
        if (slides.length >= 15) {
          try {
            // Remove any temporary early cache
            try {
              localStorage.removeItem(cacheKey + '_temp');
            } catch (e) {
              // Ignore
            }
            
            // Save final complete cache
            localStorage.removeItem(cacheKey + '_temp'); // Remove any temporary early cache
            localStorage.setItem(cacheKey, JSON.stringify(slides));
            localStorage.setItem(cacheTimestampKey, Date.now().toString());
            console.log(`✅ Successfully cached ${slides.length} images (FINAL - complete scan)`);
          } catch (e) {
            console.warn('Failed to cache slides:', e);
          }
        } else {
          console.warn(`⚠️ Only found ${slides.length} images (need at least 15 for final cache) - NOT caching final result.`);
          console.warn(`⚠️ This may be due to network issues. Images will be rescanned on next load.`);
          // Don't clear existing cache if we have one - it might be better than nothing
          // localStorage.removeItem(cacheKey);
          // localStorage.removeItem(cacheTimestampKey);
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        // Set back button link based on device type
        const backButton = document.getElementById('backToCommercial');
        const isMobile = window.innerWidth <= 1000 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (backButton) {
          backButton.href = isMobile ? 'commercial-mobile.html' : 'commercial.html';
        }
        
        // Initialize with cached data if available (for instant load)
        // But be strict - only use cache if it has images
        const cacheKey = 'cooledge-mobile-slides-cache';
        let hasInitialCache = false;
        try {
          const cached = localStorage.getItem(cacheKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            // Only use cache if it has images (strict check)
            if (parsed && Array.isArray(parsed) && parsed.length > 0) {
              slides = parsed;
              hasInitialCache = true;
              console.log(`Loaded ${slides.length} images from cache for initial display`);
            } else {
              // Bad cache - clear it
              console.log('Cache exists but is empty or invalid - clearing');
              localStorage.removeItem(cacheKey);
              localStorage.removeItem('cooledge-mobile-slides-cache-time');
            }
          }
        } catch (e) {
          console.warn('Cache read error:', e);
          // Clear bad cache
          try {
            localStorage.removeItem(cacheKey);
            localStorage.removeItem('cooledge-mobile-slides-cache-time');
          } catch (clearErr) {
            // Ignore
          }
        }
        
        // If no valid cache, show loading message
        if (!hasInitialCache || slides.length === 0) {
          slides = []; // Ensure it's empty array, not undefined
          const imageCounterEl = document.getElementById('imageCounter');
          if (imageCounterEl) {
            imageCounterEl.textContent = 'Scanning for images...';
          }
          console.log('No valid cache - will scan for images');
        }
        
        // Better mobile viewport handling for address bar
        if (window.innerHeight < 800) { // Mobile device
          // Use a more reliable method to handle mobile viewport
          const setViewportHeight = () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
          };
          
          setViewportHeight();
          window.addEventListener('resize', setViewportHeight);
          window.addEventListener('orientationchange', () => {
            setTimeout(setViewportHeight, 100);
          });
        }

        // Use a getter function for totalSlides so it always reflects current slides.length
        const getTotalSlides = () => slides.length;
        let currentSlide = 1;
        let currentPage = 0; // Current page of thumbnails (0-4)
        const slidesPerPage = 5;

        let isAnimating = false;
        let scrollAllowed = true;
        let lastScrollTime = 0;

        const thumbnailContainer = document.getElementById('thumbnailContainer');
        const leftArrow = document.querySelector('.nav-arrow-left');
        const rightArrow = document.querySelector('.nav-arrow-right');

        function generateThumbnails() {
          thumbnailContainer.innerHTML = '';
          const startIndex = currentPage * slidesPerPage;
          const endIndex = Math.min(startIndex + slidesPerPage, getTotalSlides());

          for (let i = startIndex; i < endIndex; i++) {
            const thumbnail = document.createElement('div');
            thumbnail.className = 'thumbnail';
            thumbnail.setAttribute('data-slide', i + 1);

            const img = document.createElement('img');
            img.src = slides[i].slideImg;
            img.alt = slides[i].slideTitle;
            img.loading = 'lazy';
            img.decoding = 'async';
            thumbnail.appendChild(img);

            thumbnailContainer.appendChild(thumbnail);
          }
        }

        function updateNavigation() {
          const thumbnails = document.querySelectorAll('.thumbnail');
          thumbnails.forEach((thumb) => {
            const slideIndex = parseInt(thumb.getAttribute('data-slide'));
            thumb.classList.toggle('active', slideIndex === currentSlide);
          });
        }

        function updateImageCounter() {
          const imageCounter = document.getElementById('imageCounter');
          imageCounter.textContent = `Image ${currentSlide} of ${getTotalSlides()}`;
        }

        function updateCurrentPage() {
          currentPage = Math.floor((currentSlide - 1) / slidesPerPage);
        }

        function createSlide(slideNumber) {
          const slide = document.createElement("div");
          slide.className = "slide";

          const slideData = slides[slideNumber - 1];

          slide.innerHTML = `
            <div class="slide-img">
              <img src="${slideData.slideImg}" alt="" loading="lazy" decoding="async" />
            </div>

            <div class="slide-title">
              <h1>${slideData.slideTitle}</h1>
            </div>
            
            <div class="slide-tags">
              <p>Commercial Development</p>
              <p>2021-2023</p>
              <p>100,000 sq. ft., 116 units 3-Stories</p>
            </div>
          `;

          return slide;
        }

        function splitText(slide) {
          const title = slide.querySelector("h1");
          const description = slide.querySelector("p");

          if (title) {
            const titleText = title.textContent;
            title.innerHTML = titleText
              .split(" ")
              .map((word) => `<span class="word">${word}</span>`)
              .join(" ");
          }

          if (description) {
            const descText = description.textContent;
            description.innerHTML = descText
              .split(" ")
              .map((word) => `<span class="word">${word}</span>`)
              .join(" ");
          }
        }

        // Preload upcoming images to prevent black screens
        const preloadedImages = new Set();
        function preloadImages(fromIndex, count = 5) {
          const total = getTotalSlides();
          if (total === 0) return;
          
          for (let i = 0; i < count; i++) {
            let idx = fromIndex + i;
            if (idx > total) idx = idx - total; // Wrap around
            
            if (slides[idx - 1] && !preloadedImages.has(idx)) {
              const img = new Image();
              img.src = slides[idx - 1].slideImg;
              preloadedImages.add(idx);
              
              // Preload silently in background
              img.onload = () => {
                console.log(`📥 Preloaded image ${idx}`);
              };
            }
          }
        }

        function animateSlide(direction) {
          if (isAnimating || !scrollAllowed) return;
          if (Date.now() - lastScrollTime < 150) return;

          isAnimating = true;
          scrollAllowed = false;

          const slider = document.querySelector(".slider");
          const currentSlideElement = slider.querySelector(".slide");

          const exitY = direction === "down" ? "-200vh" : "200vh";
          const entryY = direction === "down" ? "100vh" : "-100vh";
          const entryClipPath =
            direction === "down"
              ? "polygon(20% 20%, 80% 20%, 80% 100%, 20% 100%)"
              : "polygon(20% 0%, 80% 0%, 80% 80%, 20% 80%)";

          currentSlideElement.style.transform = `scale(0.25) translateY(${exitY}) rotate(30deg)`;
          currentSlideElement.style.transition = "all 0.5s ease-in-out";
          currentSlideElement.style.opacity = "0";

          setTimeout(() => {
            currentSlideElement.remove();

            if (direction === "down") {
              currentSlide = currentSlide === getTotalSlides() ? 1 : currentSlide + 1;
            } else {
              currentSlide = currentSlide === 1 ? getTotalSlides() : currentSlide - 1;
            }

            const newSlide = createSlide(currentSlide);

            newSlide.style.transform = `translateY(${entryY})`;
            newSlide.style.clipPath = entryClipPath;
            newSlide.style.transition = "all 0.4s ease-out";

            slider.appendChild(newSlide);

            splitText(newSlide);

            const words = newSlide.querySelectorAll(".word");

            words.forEach((word) => {
              word.style.transform = "translateY(100%)";
              word.style.transition = "transform 0.3s ease-out";
            });

            setTimeout(() => {
              newSlide.style.transform = "translateY(0)";
              newSlide.style.clipPath = "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)";

              setTimeout(() => {
                words.forEach((word, index) => {
                  setTimeout(() => {
                    word.style.transform = "translateY(0)";
                  }, index * 30);
                });
                
                // Re-trigger slide-tags animations
                const slideTags = newSlide.querySelectorAll(".slide-tags p");
                slideTags.forEach((tag) => {
                  tag.style.animation = "none";
                  setTimeout(() => {
                    tag.style.animation = "";
                  }, 10);
                });
              }, 200);
            }, 50);

            setTimeout(() => {
              isAnimating = false;
              updateCurrentPage();
              generateThumbnails();
              updateNavigation();
              updateImageCounter();
              
              // Preload next 5 images for smooth navigation
              preloadImages(currentSlide + 1, 5);
              
              setTimeout(() => {
                scrollAllowed = true;
                lastScrollTime = Date.now();
              }, 10);
            }, 400);
          }, 500);
        }

        // Function to jump directly to a specific slide with same animation as original
        function jumpToSlide(targetSlide) {
          if (isAnimating || !scrollAllowed) return;
          if (targetSlide === currentSlide) return;

          isAnimating = true;
          scrollAllowed = false;

          const slider = document.querySelector(".slider");
          const currentSlideElement = slider.querySelector(".slide");

          const direction = targetSlide > currentSlide ? "down" : "up";
          const exitY = direction === "down" ? "-200vh" : "200vh";
          const entryY = direction === "down" ? "100vh" : "-100vh";
          const entryClipPath =
            direction === "down"
              ? "polygon(20% 20%, 80% 20%, 80% 100%, 20% 100%)"
              : "polygon(20% 0%, 80% 0%, 80% 80%, 20% 80%)";

          currentSlideElement.style.transform = `scale(0.25) translateY(${exitY}) rotate(30deg)`;
          currentSlideElement.style.transition = "all 0.5s ease-in-out";
          currentSlideElement.style.opacity = "0";

          setTimeout(() => {
            currentSlideElement.remove();
            currentSlide = targetSlide;
            const newSlide = createSlide(currentSlide);

            newSlide.style.transform = `translateY(${entryY})`;
            newSlide.style.clipPath = entryClipPath;
            newSlide.style.transition = "all 0.4s ease-out";

            slider.appendChild(newSlide);

            splitText(newSlide);

            const words = newSlide.querySelectorAll(".word");

            words.forEach((word) => {
              word.style.transform = "translateY(100%)";
              word.style.transition = "transform 0.3s ease-out";
            });

            setTimeout(() => {
              newSlide.style.transform = "translateY(0)";
              newSlide.style.clipPath = "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)";

              setTimeout(() => {
                words.forEach((word, index) => {
                  setTimeout(() => {
                    word.style.transform = "translateY(0)";
                  }, index * 30);
                });
                
                // Re-trigger slide-tags animations
                const slideTags = newSlide.querySelectorAll(".slide-tags p");
                slideTags.forEach((tag) => {
                  tag.style.animation = "none";
                  setTimeout(() => {
                    tag.style.animation = "";
                  }, 10);
                });
              }, 200);
            }, 50);

            setTimeout(() => {
              isAnimating = false;
              updateCurrentPage();
              generateThumbnails();
              updateNavigation();
              updateImageCounter();
              
              // Preload next 5 images for smooth navigation
              preloadImages(currentSlide + 1, 5);
              
              setTimeout(() => {
                scrollAllowed = true;
                lastScrollTime = Date.now();
              }, 10);
            }, 400);
          }, 500);
        }

        // Thumbnail click handler
        if (thumbnailContainer) {
          thumbnailContainer.addEventListener('click', (e) => {
            const thumbnail = e.target.closest('.thumbnail');
            if (thumbnail && getTotalSlides() > 0) {
              const targetSlide = parseInt(thumbnail.getAttribute('data-slide'));
              if (targetSlide && targetSlide <= getTotalSlides()) {
                jumpToSlide(targetSlide);
              }
            }
          });
        }

        // Arrow navigation
        if (leftArrow) {
          leftArrow.addEventListener('click', () => {
            if (isAnimating || !scrollAllowed || getTotalSlides() === 0) return;

            // Go to first image of previous 5
            let newSlide = Math.floor((currentSlide - 1) / slidesPerPage) * slidesPerPage;
            if (newSlide < 1) {
              // If we go below 1, wrap to the last page
              newSlide = Math.floor((getTotalSlides() - 1) / slidesPerPage) * slidesPerPage + 1;
            }
            
            const newPage = Math.floor((newSlide - 1) / slidesPerPage);
            if (newPage !== currentPage) {
              currentPage = newPage;
              generateThumbnails();
            }
            
            jumpToSlide(newSlide);
          });
        }

        if (rightArrow) {
          rightArrow.addEventListener('click', () => {
            if (isAnimating || !scrollAllowed || getTotalSlides() === 0) return;

            // Go to first image of next 5
            let newSlide = Math.floor((currentSlide - 1) / slidesPerPage) * slidesPerPage + slidesPerPage + 1;
            if (newSlide > getTotalSlides()) {
              // If we go above total, wrap to the beginning
              newSlide = 1;
            }
            
            const newPage = Math.floor((newSlide - 1) / slidesPerPage);
            if (newPage !== currentPage) {
              currentPage = newPage;
              generateThumbnails();
            }
            
            jumpToSlide(newSlide);
          });
        }

        // Mouse wheel navigation with throttling
        let wheelTimeout;
        window.addEventListener("wheel", (e) => {
          if (isAnimating || !scrollAllowed) return;
          if (Date.now() - lastScrollTime < 150) return;

          // Throttle wheel events for smoother performance
          clearTimeout(wheelTimeout);
          wheelTimeout = setTimeout(() => {
            const direction = e.deltaY > 0 ? "down" : "up";
            animateSlide(direction);
          }, 16); // ~60fps throttling
        }, { passive: true });

        // Touch navigation with improved sensitivity
        let touchStartY = 0;
        let touchStartTime = 0;
        let touchMoved = false;

        window.addEventListener("touchstart", (e) => {
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
          touchMoved = false;
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
          touchMoved = true;
        }, { passive: true });

        window.addEventListener("touchend", (e) => {
          if (isAnimating || !scrollAllowed || !touchMoved) return;
          if (Date.now() - lastScrollTime < 120) return;

          const touchEndY = e.changedTouches[0].clientY;
          const touchEndTime = Date.now();
          const deltaY = touchStartY - touchEndY;
          const deltaTime = touchEndTime - touchStartTime;

          // Improved touch sensitivity
          if (Math.abs(deltaY) > 40 && deltaTime < 400) {
            const direction = deltaY > 0 ? "down" : "up";
            animateSlide(direction);
          }
        }, { passive: true });

        // Mobile viewport handling - no more problematic scroll-based address bar hiding

        // Initialize the gallery immediately with cached data (if available)
        // This makes the page appear instantly on mobile
        if (slides.length > 0) {
          generateThumbnails();
          updateNavigation();
          updateImageCounter();
        } else {
          // Even if no slides yet, initialize the UI so gallery is ready
          updateImageCounter();
        }
        
        // Listen for progressive slide updates during scan
        // Throttle updates to avoid performance issues on mobile
        let lastUpdateTime = 0;
        const updateThrottle = 300; // Update UI max once per 300ms (faster updates)
        
        window.addEventListener('slidesUpdated', function(e) {
          const now = Date.now();
          if (now - lastUpdateTime < updateThrottle) return;
          lastUpdateTime = now;
          
          const count = e.detail.count;
          const presentArray = e.detail.present;
          
          if (count > 0 && presentArray && presentArray.length > 0) {
            // Use numeric sort for sequential images (consistent with scan)
            const sortedArray = [...presentArray].sort((a, b) => {
              const numA = parseInt(a.replace('.webp', ''), 10);
              const numB = parseInt(b.replace('.webp', ''), 10);
              return numA - numB;
            });
            
            // Only update if we have more images than before (prevents missing images)
            if (sortedArray.length >= slides.length) {
              slides = sortedArray.map((image) => {
                const imageNumber = image.replace(/\.webp$/i, '');
                return {
                  slideTitle: `Grandview Casa Blanca South`,
                  slideDescription: `Documentation of the Grandview Casa Blanca South development project, showcasing the comprehensive construction and design process.`,
                  slideImg: `/Cooledge_Mobile/${image}`,
                };
              });
              
              updateImageCounter();
              if (currentSlide === 1 && slides.length > 0) {
                updateCurrentPage();
                generateThumbnails();
                updateNavigation();
                
                // Create first slide if it doesn't exist
                const slider = document.querySelector(".slider");
                if (slider && !slider.querySelector(".slide")) {
                  const firstSlide = createSlide(1);
                  slider.appendChild(firstSlide);
                  splitText(firstSlide);
                }
              }
            }
          }
        });
        
        // Build slide manifest in background (non-blocking)
        // Images will appear progressively as they're found
        buildCooledgeMobileSlides().then(() => {
          console.log(`buildCooledgeMobileSlides completed with ${slides.length} slides`);
          
          // Final update when scan completes
          updateImageCounter();
          
          if (slides.length > 0) {
            // Final gallery update
            updateCurrentPage();
            generateThumbnails();
            updateNavigation();
            
            // Ensure first slide is displayed
            const slider = document.querySelector(".slider");
            if (slider) {
              const existingSlide = slider.querySelector(".slide");
              if (!existingSlide || currentSlide === 1) {
                if (existingSlide) {
                  existingSlide.remove();
                }
                const firstSlide = createSlide(1);
                slider.appendChild(firstSlide);
                splitText(firstSlide);
              }
            }
            
            // Preload first 10 images for smooth initial navigation
            setTimeout(() => {
              preloadImages(1, 10);
            }, 500);
          } else {
            // No slides found - show message
            const imageCounterEl = document.getElementById('imageCounter');
            if (imageCounterEl) {
              imageCounterEl.textContent = 'No images found. Check console.';
              imageCounterEl.style.background = 'rgba(255, 0, 0, 0.3)';
            }
            console.error('No images found! Check network connection and image paths.');
            console.error('Expected images in: /Cooledge_Mobile/ (1.webp through 21.webp)');
            console.error('User Agent:', navigator.userAgent);
            console.error('Is iOS:', /iPhone|iPad|iPod/.test(navigator.userAgent));
            
            // Try to test if first image loads
            const testImg = new Image();
            testImg.onload = () => console.log('✅ Test image /Cooledge_Mobile/1.webp loaded successfully');
            testImg.onerror = () => console.error('❌ Test image /Cooledge_Mobile/1.webp failed to load');
            testImg.src = '/Cooledge_Mobile/1.webp';
          }
        }).catch(err => {
          console.error('Error building slides:', err);
          console.error('Error details:', err.stack || err.message);
          updateImageCounter();
          if (slides.length > 0) {
            updateCurrentPage();
            generateThumbnails();
            updateNavigation();
            console.log(`Using ${slides.length} images despite error`);
          } else {
            const imageCounterEl = document.getElementById('imageCounter');
            if (imageCounterEl) {
              imageCounterEl.textContent = 'Error loading images - check console';
              imageCounterEl.style.background = 'rgba(255, 0, 0, 0.3)';
            }
            console.error('No images found. Check network connection and image paths.');
            console.error('Trying to load from: /Cooledge_Mobile/');
          }
        });
      });
    </script>
  </body>
</html>
